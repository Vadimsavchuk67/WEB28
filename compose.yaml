services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      - post-data:/data
    restart: unless-stopped

  site:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  post-data:
